<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56">
  <!-- Red rectangle: same height as the badge (56), longer width -->
  <rect x="0" y="0" width="260" height="56" fill="red" />

  <!-- White square badge at the end -->
  <rect x="204" y="0" width="56" height="56" fill="white" />

  <!-- "MIT" text centered in the square -->
  <text x="232" y="35"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="red"
        text-anchor="middle">MIT</text>
</svg>