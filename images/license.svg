<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <!-- Red rectangle -->
  <rect x="0" y="0" width="200" height="120" fill="red" />

  <!-- White square badge at the end (right side) -->
