  <!-- "MIT" text centered in the white square -->
  <text x="168" y="95"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="red"
        text-anchor="middle">GPLv3</text>
</svg>